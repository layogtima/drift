name = "drift-api"
main = "src/index.js"
compatibility_date = "2024-01-01"
workers_dev = true
preview_urls = true

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "drift-db-prod"
database_id = "9a2de5d5-a31f-473c-b95f-42a5a64a6d31"

# CORS settings
[vars]
ALLOWED_ORIGINS = "https://drift.surf,http://localhost:5501/,chrome-extension://*"

# Secrets (set via `wrangler secret put <NAME>`)
# RESEND_API_KEY - API key for Resend email service (email verification & password reset)

# Custom domain - api.drift.surf
[[routes]]
pattern = "api.drift.surf"
custom_domain = true

[observability]
[observability.logs]
enabled = false
head_sampling_rate = 1
invocation_logs = true
persist = true